[project]
name = "lab-seguranca-owasp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SouzaDiegoCl", email = "souzadiegocl@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
lab-seguranca-owasp = "lab_seguranca_owasp:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "security: testes de seguranca ofensiva e defensiva (OWASP)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*testclient.*:Warning",
]